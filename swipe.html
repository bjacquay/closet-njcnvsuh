<style>
:root{--bg:#f6f4f0;--ink:#161616;--mute:#7a766e;--line:#e5e1d9;--photo:#ebe7e0;--keep:#5f7356;--toss:#a8432f}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%;overflow:hidden;overscroll-behavior:none}
body{background:var(--bg);color:var(--ink);font:15px/1.45 Inter,system-ui,-apple-system,sans-serif;-webkit-font-smoothing:antialiased;display:flex;flex-direction:column;height:100dvh;padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom)}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer}
header{display:flex;align-items:center;justify-content:space-between;padding:12px 18px 6px}
.logo{font:400 22px/1 "Instrument Serif",serif;text-decoration:none;color:var(--ink)}.logo i{color:var(--mute)}
.done{font-size:12px;font-weight:600;letter-spacing:.1em;text-transform:uppercase;padding:8px 14px;border:1px solid var(--ink);border-radius:99px}
.bar{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:6px 18px 10px}
.seg{display:flex;background:#ebe7e0;border-radius:99px;padding:3px}
.seg button{font-size:12.5px;font-weight:500;padding:6px 12px;border-radius:99px;color:var(--mute)}
.seg button.on{background:#fff;color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.08)}
.count{font-size:13px;color:var(--mute);font-variant-numeric:tabular-nums}
.prog{height:3px;background:var(--line);margin:0 18px;border-radius:3px;overflow:hidden}
.prog i{display:block;height:100%;width:0;background:var(--ink);transition:width .3s}
.stage{position:relative;flex:1;margin:14px 18px 0;min-height:0}
.card{position:absolute;inset:0;background:#fff;border-radius:22px;overflow:hidden;box-shadow:0 10px 30px rgba(30,25,15,.12);touch-action:none;user-select:none;-webkit-user-select:none;will-change:transform;display:flex;flex-direction:column}
.card .ph{flex:1;min-height:0;background:var(--photo)}
.card img{width:100%;height:100%;object-fit:cover;display:block;pointer-events:none;-webkit-user-drag:none}
.card .info{padding:14px 18px 16px}
.card h2{font:400 28px/1.1 "Instrument Serif",serif}
.card p{font-size:13px;color:var(--mute);text-transform:capitalize;margin-top:2px}
.sug{position:absolute;top:14px;left:14px;font-size:11px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;background:rgba(22,22,22,.82);color:#fff;padding:6px 10px;border-radius:99px}
.stamp{position:absolute;top:28px;font:600 30px/1 Inter,sans-serif;letter-spacing:.12em;padding:8px 14px;border:4px solid;border-radius:10px;opacity:0;pointer-events:none}
.stamp.keep{left:22px;color:var(--keep);transform:rotate(-14deg)}
.stamp.toss{right:22px;color:var(--toss);transform:rotate(14deg)}
.card.back{transform:scale(.95) translateY(12px);box-shadow:none;transition:transform .25s}
.actions{display:flex;align-items:center;justify-content:center;gap:22px;padding:16px 0 18px}
.btn{width:66px;height:66px;border-radius:50%;background:#fff;box-shadow:0 4px 14px rgba(0,0,0,.08);display:flex;align-items:center;justify-content:center;flex-direction:column;font-size:10.5px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;transition:transform .12s}
.btn:active{transform:scale(.92)}
.btn svg{width:24px;height:24px;margin-bottom:2px}
.btn.toss{color:var(--toss)}.btn.keep{color:var(--keep)}
.btn.undo{width:48px;height:48px;color:var(--mute)}.btn.undo svg{width:18px;height:18px;margin:0}
.btn:disabled{opacity:.35}
.empty{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;text-align:center;color:var(--mute)}
/* summary */
.sheet{position:fixed;inset:0;background:var(--bg);z-index:50;display:none;flex-direction:column;padding:calc(env(safe-area-inset-top) + 14px) 18px calc(env(safe-area-inset-bottom) + 18px);overflow-y:auto;-webkit-overflow-scrolling:touch}
.sheet.open{display:flex}
.sheet .eyebrow{font-size:11px;font-weight:600;letter-spacing:.14em;text-transform:uppercase;color:var(--mute);margin-top:10px}
.sheet h1{font:400 40px/1.05 "Instrument Serif",serif;margin:6px 0 4px}
.sheet .sub{color:var(--mute);font-size:14px;margin-bottom:16px}
.list{background:#fff;border:1px solid var(--line);border-radius:18px;overflow:hidden;margin-bottom:16px}
.row{display:flex;align-items:center;gap:12px;padding:10px 12px;border-bottom:1px solid var(--line)}
.row:last-child{border:0}
.row img{width:44px;height:54px;object-fit:cover;border-radius:8px;background:var(--photo)}
.row b{font-weight:500;font-size:14px}.row span{display:block;font-size:12px;color:var(--mute)}
.big{width:100%;padding:17px;border-radius:99px;background:var(--ink);color:#fff;font-weight:600;font-size:16px;margin-bottom:10px}
.ghost{width:100%;padding:15px;border-radius:99px;border:1px solid var(--ink);font-weight:500;margin-bottom:10px}
textarea{width:100%;min-height:110px;border:1px solid var(--line);border-radius:14px;padding:12px;font:13px/1.45 ui-monospace,Menlo,monospace;background:#fff;margin-bottom:12px;resize:vertical}
.links{display:flex;justify-content:space-between;font-size:13px;color:var(--mute);margin-top:6px}
.links a,.links button{color:var(--mute);text-decoration:underline}
.toast{position:fixed;left:50%;bottom:calc(env(safe-area-inset-bottom) + 28px);transform:translateX(-50%) translateY(20px);background:var(--ink);color:#fff;padding:10px 18px;border-radius:99px;font-size:13px;opacity:0;transition:.25s;z-index:60;pointer-events:none}
.toast.show{opacity:1;transform:translateX(-50%)}
</style></head>

  const move=(x,y)=>{dx=x-sx;dy=y-sy;card._dy=dy;
    card.style.transform=`translate(${dx}px,${dy*.4}px) rotate(${dx/18}deg)`;
    const p=Math.min(Math.abs(dx)/110,1);keep.style.opacity=dx>0?p:0;toss.style.opacity=dx<0?p:0};
  const end=()=>{if(!drag)return;drag=false;
    const v=Math.abs(dx)/Math.max(Date.now()-t0,1);
    if(Math.abs(dx)>window.innerWidth*.28||(v>.5&&Math.abs(dx)>40))fling(card,dx>0?1:-1);
    else{card.style.transition="transform .35s cubic-bezier(.2,1.4,.4,1)";card.style.transform="";keep.style.opacity=0;toss.style.opacity=0}};
  const start=(x,y)=>{drag=true;sx=x;sy=y;dx=dy=0;t0=Date.now();card.style.transition="none"};
  if(window.PointerEvent){
    card.addEventListener("pointerdown",e=>{pid=e.pointerId;card.setPointerCapture(pid);start(e.clientX,e.clientY)});
    card.addEventListener("pointermove",e=>{if(drag&&e.pointerId===pid){e.preventDefault();move(e.clientX,e.clientY)}});
    card.addEventListener("pointerup",end);card.addEventListener("pointercancel",end);
  }else{
    card.addEventListener("touchstart",e=>{const t=e.touches[0];start(t.clientX,t.clientY)},{passive:true});
    card.addEventListener("touchmove",e=>{e.preventDefault();const t=e.touches[0];move(t.clientX,t.clientY)},{passive:false});
    card.addEventListener("touchend",end);
  }
}
// block page scroll / rubber-band while dragging on iOS
document.addEventListener("touchmove",e=>{if(!e.target.closest(".sheet"))e.preventDefault()},{passive:false});
const topCard=()=>{const c=stage.querySelectorAll(".card");return c[c.length-1]&&!c[c.length-1].classList.contains("back")?c[c.length-1]:null};
$("#keepBtn").onclick=()=>{const c=topCard();c&&fling(c,1)};
$("#tossBtn").onclick=()=>{const c=topCard();c&&fling(c,-1)};
$("#undoBtn").onclick=()=>{const id=S.hist.pop();if(!id)return;delete S.dec[id];
  if(!order().some(i=>i.id===id))S.mode="all";save();render();toast("Undid "+byId[id].n)};
document.addEventListener("keydown",e=>{if($("#sheet").classList.contains("open"))return;if(e.key==="ArrowRight")$("#keepBtn").click();if(e.key==="ArrowLeft")$("#tossBtn").click();if(e.key==="z"||e.key==="Backspace")$("#undoBtn").click()});
$("#mode").onclick=e=>{const b=e.target.closest("button");if(!b||!HAS_SUG)return;S.mode=b.dataset.m;save();render()};
// summary
function resultText(){
  const t=D.items.filter(i=>S.dec[i.id]==="toss"),k=D.items.filter(i=>S.dec[i.id]==="keep");
  let s="Tossed: "+(t.length?t.map(i=>num(i.id)+" "+i.n).join(", "):"none");
  const kept=k.filter(i=>i.out);if(kept.length)s+="\nKept (suggested to let go): "+kept.map(i=>num(i.id)+" "+i.n).join(", ");
  s+=`\n(${Object.keys(S.dec).length} of ${D.items.length} items reviewed)`;return s;
}
function openSummary(){
  const t=D.items.filter(i=>S.dec[i.id]==="toss");
  $("#sumTitle").textContent=t.length?`${t.length} to toss`:"Nothing tossed yet";
  $("#sumSub").textContent=`${Object.keys(S.dec).length} of ${D.items.length} reviewed. Copy this and paste it back in the chat.`;
  $("#sumList").innerHTML=t.map(i=>`<div class="row"><img src="${D.img[i.id]}" alt=""><div><b>${esc(i.n)}</b><span>#${num(i.id)}</span></div></div>`).join("")||'<div class="row"><span>Swipe left on anything you got rid of.</span></div>';
  $("#sumList").style.display="block";
  $("#out").value=resultText();
  $("#shareBtn").style.display=navigator.share?"block":"none";
  $("#sheet").classList.add("open");
}
$("#doneBtn").onclick=openSummary;
$("#backBtn").onclick=()=>$("#sheet").classList.remove("open");
$("#resetBtn").onclick=()=>{if(confirm("Clear all your swipes and start over?")){S={mode:"all",dec:{},hist:[]};save();$("#sheet").classList.remove("open");render()}};
$("#copyBtn").onclick=async()=>{const txt=resultText();
  try{await navigator.clipboard.writeText(txt);toast("Copied. Paste it in the chat")}
  catch(e){const ta=$("#out");ta.focus();ta.select();ta.setSelectionRange(0,txt.length);
    let ok=false;try{ok=document.execCommand("copy")}catch(_){}toast(ok?"Copied. Paste it in the chat":"Text selected. Tap Copy")}};
$("#shareBtn").onclick=()=>navigator.share({title:"Keep or Toss results",text:resultText()}).catch(()=>{});
render();
</script>
</body></html>
